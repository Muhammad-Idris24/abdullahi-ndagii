name: Build and Deploy

# Rebuild the artist portfolio site and deploy to GitHub Pages whenever content changes.
# Pipeline:
#   1. Checkout repo
#   2. Setup Python + Node (Node)
#   3. Install Python deps (jinja2, weasyprint, etc.)
#   4. Validate content
#   5. Build site (HTML + PDFs)
#   6. Publish as Pages artifact

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "templates/**"
      - "content/**"
      - "static/**"
      - "images/**"
      - "admin/**"
      - "requirements.txt"
      - ".github/workflows/*.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install WeasyPrint system dependencies (Ubuntu packages
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
          libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev libcairo2 \
          fonts-noto fonts-dejavu

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate content
        working-directory: src
        run: |
          python validate.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Build website and generate PDFs
        working-directory: src
        run: |
          python build.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Check public/ output exists
        run: |
          test -d public
          test -f public/index.html

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
